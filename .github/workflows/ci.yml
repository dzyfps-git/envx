name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # While the repository is private, Actions minutes are billed (macOS at 10x): run only when started by hand.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Unit tests run everywhere; golden tests need a synced environment and skip themselves on CI.
      - run: ./gradlew test installDist --no-daemon
      - run: build/install/sevli/bin/sevli help
