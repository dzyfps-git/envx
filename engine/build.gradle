plugins {
    id 'application'
}

group = 'dev.sevli'
version = '2.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    implementation 'org.ow2.asm:asm:9.9'
    implementation 'org.ow2.asm:asm-tree:9.9'
    implementation 'net.fabricmc:mapping-io:0.8.0'
    implementation 'net.fabricmc:tiny-remapper:0.13.0'
    implementation 'org.vineflower:vineflower:1.12.0'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The licence texts of everything bundled travel with every distribution (THIRD-PARTY-NOTICES.md).
distributions {
    main {
        contents {
            from('..') { include 'LICENSE', 'THIRD-PARTY-NOTICES.md' }
            from('../licenses') { into 'licenses' }
        }
    }
}

application {
    mainClass = 'dev.sevli.cli.Main'
    applicationName = 'sevli'
    applicationDefaultJvmArgs = ['-Xss4m', '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// `envx`, the name before 2.0, keeps working for the 2.x line: a second start script that runs sevli and says so once.
def envxScripts = tasks.register('envxStartScripts', CreateStartScripts) {
    mainClass = application.mainClass
    applicationName = 'envx'
    outputDir = layout.buildDirectory.dir('envx-scripts').get().asFile
    classpath = tasks.named('startScripts').get().classpath
    defaultJvmOpts = application.applicationDefaultJvmArgs + ['-Dsevli.alias=envx']
}
distributions.main.contents { from(envxScripts) { into 'bin' } }

test {
    useJUnitPlatform()
    // Golden tests that need the local Loom cache / pack are skipped automatically when it is absent.
    systemProperty 'sevli.home', System.getProperty('sevli.home', '')
}
